version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: keoni_db
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - ./volumes/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keoni_net

  matching-api:
    build:
      context: ./services/matching-api
      dockerfile: Dockerfile
    container_name: keoni_matching_api
    env_file: .env
    environment:
      MATCHING_API_KEY: ${MATCHING_API_KEY}
      MODEL_CACHE: /models
      DATA_DIR: /data/cv_raw
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: ${TIMEZONE}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./volumes/models:/models
      - ./volumes/data/cv_raw:/data/cv_raw
    networks:
      - keoni_net

  n8n:
    image: n8nio/n8n:latest
    container_name: keoni_n8n
    env_file: .env
    environment:
      GENERIC_TIMEZONE: ${TIMEZONE}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "false"
    depends_on:
      - db
    ports:
      - "5678:5678"
    volumes:
      - ./volumes/n8n:/home/node/.n8n
    networks:
      - keoni_net

networks:
  keoni_net:
    driver: bridge
